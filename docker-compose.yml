# Полный запуск: docker compose up -d --build
# Только база для локальной разработки: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadmaps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadmaps}
      POSTGRES_DB: roadmaps
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Песочница SQL-тренажёра: роль и база создаются при первом старте.
      - ./scripts/sql-practice-init.sql:/docker-entrypoint-initdb.d/01-sql-practice.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmaps -d roadmaps"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://roadmaps:${POSTGRES_PASSWORD:-roadmaps}@db:5432/roadmaps
      SQL_PRACTICE_URL: postgres://sql_practice:sql_practice@db:5432/sql_practice
    ports:
      - "3000:3000"
    volumes:
      # Контент монтируется с хоста: после `git pull` сайт подхватит изменения за минуту, без пересборки.
      - ./content:/app/content:ro
      # Ключ для входа на учебный стенд (npm run lab:key): сайт по нему выполняет setup и проверки задач.
      - ./.lab:/app/.lab:ro
    depends_on:
      db:
        condition: service_healthy

  # Терминал учебного стенда в браузере. Включается профилем: COMPOSE_PROFILES=lab в .env
  # (нужны LAB_SECRET, LAB_SSH_HOST и ключ в .lab/, владелец — uid 1000).
  lab-runner:
    profiles: ["lab"]
    build:
      context: .
      target: labrunner
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      - ./.lab:/app/.lab:ro

volumes:
  pgdata:
